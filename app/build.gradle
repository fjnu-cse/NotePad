apply plugin: 'com.android.application'

android {
    namespace 'com.example.android.notepad'
    compileSdk 37

    // The project still uses the legacy android.test classes in src/androidTest.
    // They are no longer part of android.jar on modern SDKs, but the SDK still
    // ships them as optional libraries; make them available to the test sources.
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    defaultConfig {
        applicationId "com.example.android.notepad"
        minSdk 21
        targetSdk 34

        testApplicationId "com.example.android.notepad.tests"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
